[platformio]
default_envs = ec5_partial_hold_warm_session_v1
build_dir = .pio/build-partial-hold-warm-session-v1

[env:ec5_partial_hold_warm_session_v1]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter =
  -<*>
  +<ec5_partial_hold_warm_session_v1_epd_driver.cpp>
  +<ec5_partial_hold_warm_session_v1_main.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -g0
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_CHROMA_GRID=1
  -D MF1750_RUNTIME_LUT_PARTIAL_HOLD_BUILD=1
  -D MF1750_RUNTIME_LUT_PARTIAL_HOLD_V4_BUILD=1
  -D MF1750_PARTIAL_HOLD_WARM_SESSION_V1_BUILD=1
  -D MF1750_ENABLE_RUNTIME_LUT_EMPIRICAL_H3=0
