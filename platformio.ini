[env:esp32-s3-devkitc-1-wf-a1-pll50]
# WF A1 PLL single-axis variant (docs/MF1750_WAVEFORM_EXPLORATION_OPTIONS_20261011.md
# section 4; bundle WF_AB_BUNDLES_20261011_V1): v1 frame path + variant table from
# generated/spd1657_wf_ab_bundles.inc (R20 header byte 6 + runtime 0x30 byte ->
# PLL 0x03; PWR identical to active).  Dedicated TUs; production/v1/v2/ladder untouched.
extends = env:esp32-s3-devkitc-1
build_src_filter =
  -<epd_driver.cpp>
  +<wf_ab_epd_driver.cpp>
  +<wf_ab_main.cpp>
  -<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D MF1750_L535_FRAME_PATH_BUILD=1
  -D MF1750_WF_AB_VARIANT=0

[env:esp32-s3-devkitc-1-wf-b1-vshlv2-6900]
# WF B1 VSH_LV2 single-axis variant (docs/MF1750_WAVEFORM_EXPLORATION_OPTIONS_20261011.md
# section 5; bundle WF_AB_BUNDLES_20261011_V1): v1 frame path + variant table from
# generated/spd1657_wf_ab_bundles.inc (R20 header byte 3 = 0x27 / VSH_LV2 6900 mV +
# PWR mirror byte 4; PLL stays 0x02; R21 untouched).  Dedicated TUs.
extends = env:esp32-s3-devkitc-1
build_src_filter =
  -<epd_driver.cpp>
  +<wf_ab_epd_driver.cpp>
  +<wf_ab_main.cpp>
  -<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D MF1750_L535_FRAME_PATH_BUILD=1
  -D MF1750_WF_AB_VARIANT=1

[env:esp32-s3-devkitc-1-wf-g6-white]
# WF White group 6 single-record variant: active R20 except [249:260], which is
# replaced by the commented White group 6 record.  Group 7, PWR and PLL=0x02
# stay active.  Dedicated TUs; production/v1/v2/ladder/wf_ab untouched.
extends = env:esp32-s3-devkitc-1
build_src_filter =
  -<epd_driver.cpp>
  +<wf_g6_white_epd_driver.cpp>
  +<wf_g6_white_main.cpp>
  -<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D MF1750_L535_FRAME_PATH_BUILD=1

[env:esp32-s3-devkitc-1-wf-commented-full]
# WF full-commented runtime-table variant: the complete 535-byte R20 table,
# header, PWR mirror and PLL=0x03 use the sealed commented identity.  R21 and
# the runtime sequence stay on the active path.  Dedicated TUs.
extends = env:esp32-s3-devkitc-1
build_src_filter =
  -<epd_driver.cpp>
  +<wf_commented_full_epd_driver.cpp>
  +<wf_commented_full_main.cpp>
  -<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D MF1750_L535_FRAME_PATH_BUILD=1

[env:esp32-s3-devkitc-1-wf-bisect-r1]
# Bisection R1: active R20 header (including PLL=0x02) with every record byte
# from commented.  PWR follows the active header; R21/runtime sequence unchanged.
extends = env:esp32-s3-devkitc-1
build_src_filter =
  -<epd_driver.cpp>
  +<wf_bisect_r1_epd_driver.cpp>
  +<wf_bisect_r1_main.cpp>
  -<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D MF1750_L535_FRAME_PATH_BUILD=1

[env:esp32-s3-devkitc-1-wf-bisect-r2a]
# Bisection R2A: active header and Yellow/Red/Power, commented VCOM/Black/White.
# PWR and PLL=0x02 follow the active header; R21/runtime sequence unchanged.
extends = env:esp32-s3-devkitc-1
build_src_filter =
  -<epd_driver.cpp>
  +<wf_bisect_r2a_epd_driver.cpp>
  +<wf_bisect_r2a_main.cpp>
  -<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D MF1750_L535_FRAME_PATH_BUILD=1

[env:esp32-s3-devkitc-1-wf-bisect-r2b]
# Bisection R2B: only VCOM comes from commented.  Header and every non-VCOM byte
# stay active; PWR and PLL=0x02 follow the active header; R21/runtime unchanged.
extends = env:esp32-s3-devkitc-1
build_src_filter =
  -<epd_driver.cpp>
  +<wf_bisect_r2b_epd_driver.cpp>
  +<wf_bisect_r2b_main.cpp>
  -<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D MF1750_L535_FRAME_PATH_BUILD=1
