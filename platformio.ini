[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
upload_speed = 115200
upload_port = COM8
monitor_port = COM8
build_src_filter =
  +<epd_driver.cpp>
  +<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
board_build.filesystem = littlefs
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0

[env:esp32-s3-devkitc-1-l535-frame]
# L535 frame path variant (docs/MF1750_L535_FRAME_PATH_DESIGN_2026-09-26.md):
# production upload path + L535 active runtime LUT loaded per refresh after
# cascade init; all eight nibbles are drive codes (white=7). Dedicated driver
# translation unit; src/epd_driver.cpp stays pinned/untouched.
extends = env:esp32-s3-devkitc-1
build_src_filter =
  -<epd_driver.cpp>
  +<l535_frame_epd_driver.cpp>
  +<l535_frame_main.cpp>
  -<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D MF1750_L535_FRAME_PATH_BUILD=1

[env:esp32-s3-devkitc-1-l535-frame-v2]
# L535 frame path v2 (docs/MF1750_L535_FRAME_PATH_DESIGN_2026-09-26.md section
# 16): single PSR {5F,E9} write at cascade init (no rewrite), R20 full 799-byte
# container, build tag MF1750_L535_FRAME_V2_20261006. Dedicated TUs; v1 and
# production stay untouched.
extends = env:esp32-s3-devkitc-1
build_src_filter =
  -<epd_driver.cpp>
  +<l535_frame_v2_epd_driver.cpp>
  +<l535_frame_v2_main.cpp>
  -<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D MF1750_L535_FRAME_PATH_BUILD=1

[env:esp32-s3-devkitc-1-l535-vsh6000]
# L535 vsh_lv ladder rung 6000 mV (docs/MF1750_L535_FRAME_PATH_DESIGN_2026-09-26.md;
# VSH_LADDER_20261009_V1): v1 frame path + rung table from
# generated/spd1657_l535_vsh_ladder.inc.  Dedicated TUs; production/v1/v2 untouched.
extends = env:esp32-s3-devkitc-1
