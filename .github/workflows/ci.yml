name: Repository CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "research/**"
      - "integration/**"
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.13"
  PLATFORMIO_CORE_VERSION: "6.1.19"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contracts:
    name: Host tests and frozen contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify repository contracts
        id: repository-contracts
        continue-on-error: true
        run: python tools/check_repo_contract.py --output repo-contract-report.json

      - name: Run host regression tests
        id: host-tests
        continue-on-error: true
        run: python tools/run_host_tests.py --output host-test-report.json --force

      - name: Validate machine-readable host reports
        id: report-contracts
        if: always()
        continue-on-error: true
        run: python tools/validate_ci_reports.py

      - name: Upload machine-readable host reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-contract-reports
          path: |
            host-test-report.json
            repo-contract-report.json
          if-no-files-found: warn

      - name: Enforce host gates
        if: always()
        env:
          CONTRACT_OUTCOME: ${{ steps.repository-contracts.outcome }}
          TEST_OUTCOME: ${{ steps.host-tests.outcome }}
          REPORT_OUTCOME: ${{ steps.report-contracts.outcome }}
        run: |
          echo "repository contracts: ${CONTRACT_OUTCOME}"
          echo "host regression tests: ${TEST_OUTCOME}"
          echo "machine report validation: ${REPORT_OUTCOME}"
          if [[ "${CONTRACT_OUTCOME}" != "success" || "${TEST_OUTCOME}" != "success" || "${REPORT_OUTCOME}" != "success" ]]; then
            exit 1
          fi

  firmware-build:
    name: PlatformIO release build (hardware not tested)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PlatformIO downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PlatformIO Core
        run: |
          python -m pip install --disable-pip-version-check "platformio==${PLATFORMIO_CORE_VERSION}"
          python -m platformio --version

      - name: Build release firmware
        run: python -m platformio run
