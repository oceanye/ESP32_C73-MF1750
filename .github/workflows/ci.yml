name: Repository CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "research/**"
      - "integration/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contracts:
    name: Host tests and frozen contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify repository contracts
        run: python tools/check_repo_contract.py --output repo-contract-report.json

      - name: Run host regression tests
        run: python -m unittest discover -s tests -v

      - name: Upload machine-readable contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-contract-report
          path: repo-contract-report.json
          if-no-files-found: warn

  firmware-build:
    name: PlatformIO release build (hardware not tested)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build release firmware
        run: pio run

