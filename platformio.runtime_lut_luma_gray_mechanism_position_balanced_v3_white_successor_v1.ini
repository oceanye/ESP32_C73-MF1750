[platformio]
default_envs = ec5_luma_gray_mpb_v3_white_v1
build_dir = .pio/b-luma-gray-mpb-v3-white-v1

[env:ec5_luma_gray_mpb_v3_white_v1]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter =
  -<*>
  +<epd_driver.cpp>
  +<ec5_runtime_lut_luma_gray_mechanism_position_balanced_v3_white_successor_v1_main.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -g0
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_FACTORY_OTP_WHITE_RECOVERY=1
  -D MF1750_OTP_WHITE_FOR_PROFILE_WF20_25=0
  -D MF1750_OTP_WHITE_FOR_PROFILE_WF23_25=1
  -D MF1750_OTP_WHITE_FOR_DUAL_R20_H20_20260821=0
  -D MF1750_OTP_WHITE_FOR_DUAL_R20_H23_20260821=0
  -D MF1750_PURE_FIELD_WHITE=1
  -D MF1750_LUMA_GRAY_MECHANISM_POSITION_BALANCED_V3_WHITE_SUCCESSOR_V1_BUILD=1


