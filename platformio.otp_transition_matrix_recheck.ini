[platformio]
default_envs = esp32-s3-devkitc-1-ec5-otp-transition-matrix-recheck

[env:esp32-s3-devkitc-1-ec5-otp-transition-matrix-recheck]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
build_src_filter =
  -<*>
  +<epd_driver.cpp>
  +<ec5_otp_transition_matrix_recheck_main.cpp>
board_build.filesystem = littlefs
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_OTP_TRANSITION_MATRIX=1
  -D MF1750_OTP_TRANSITION_MATRIX_RECHECK=1
