[platformio]
default_envs = ec5_runtime_lut_partial_hold_l535_active_v2
build_dir = .pio/build-runtime-lut-partial-hold-v2

[env]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter =
  -<*>
  +<ec5_runtime_lut_partial_hold_epd_driver.cpp>
  +<ec5_runtime_lut_partial_hold_main.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -g0
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_CHROMA_GRID=1
  -D MF1750_RUNTIME_LUT_PARTIAL_HOLD_BUILD=1
  -D MF1750_RUNTIME_LUT_PARTIAL_HOLD_V2_BUILD=1
  -D MF1750_ENABLE_RUNTIME_LUT_EMPIRICAL_H3=0

[env:ec5_runtime_lut_partial_hold_l535_active_v2]
extends = env
