[platformio]
default_envs = esp32-s3-devkitc-1-ec5-chroma-grid

[env:esp32-s3-devkitc-1-ec5-chroma-grid]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
build_src_filter =
  -<*>
  +<ec5_chroma_grid_epd_driver.cpp>
  +<ec5_chroma_grid_main.cpp>
board_build.filesystem = littlefs
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_CHROMA_GRID=1
