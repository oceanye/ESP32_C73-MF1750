[platformio]
default_envs = ec5_p2_commented_endpoint_atlas_4x8_v1
build_dir = .pio/build-p2-commented-endpoint-atlas-4x8-v1
src_dir = .pio/generated-p2-commented-endpoint-atlas-4x8-v1

[env:ec5_p2_commented_endpoint_atlas_4x8_v1]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter =
  -<*>
  +<ec5_p2_commented_endpoint_atlas_4x8_v1_epd_driver.cpp>
  +<ec5_p2_commented_endpoint_atlas_4x8_v1_main.cpp>
build_flags =
  -I src
  -D CORE_DEBUG_LEVEL=3
  -g0
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_CHROMA_GRID=1
  -D MF1750_RUNTIME_LUT_PARTIAL_HOLD_BUILD=1
  -D MF1750_P2_COMMENTED_ENDPOINT_ATLAS_4X8_V1_BUILD=1
  -D MF1750_ENABLE_RUNTIME_LUT_EMPIRICAL_H3=0
  -D MF1750_ENABLE_FACTORY_OTP_WHITE_RECOVERY=0
  -D MF1750_OTP_WHITE_FOR_PROFILE_WF20_25=0
  -D MF1750_OTP_WHITE_FOR_PROFILE_WF23_25=0
