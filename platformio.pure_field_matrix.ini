build_flags = ${env:pf_treatment.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=7 -D MF1750_PURE_FIELD_LAYOUT=3 -D MF1750_DUAL_R20_GLOBAL_WF20_25=0 -D MF1750_DUAL_R20_GLOBAL_WF23_25=1

[env:ec5_pfm_h3_h23_white]
