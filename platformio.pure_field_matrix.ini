[platformio]
default_envs =
  ec5_pfm_m0_h20
  ec5_pfm_m0_h20_white
  ec5_pfm_m0_h23
  ec5_pfm_m0_h23_white
  ec5_pfm_h1_h20
  ec5_pfm_h1_h20_white
  ec5_pfm_h1_h23
  ec5_pfm_h1_h23_white
  ec5_pfm_h2_h20
  ec5_pfm_h2_h20_white
  ec5_pfm_h2_h23
  ec5_pfm_h2_h23_white
  ec5_pfm_h3_h20
  ec5_pfm_h3_h20_white
  ec5_pfm_h3_h23
  ec5_pfm_h3_h23_white
build_dir = .pio/build-pure-field-matrix

[env:pf_common]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -g0
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0

[env:pf_treatment]
extends = env:pf_common
build_src_filter =
  -<*>
  +<ec5_dual_r20_h20_epd_driver.cpp>
  +<ec5_dual_r20_h20_main.cpp>
build_flags =
  ${env:pf_common.build_flags}
  -D MF1750_ENABLE_RUNTIME_LUT_EMPIRICAL_H3=1
  -D MF1750_RUNTIME_LUT_PROFILE_WF20_25=1
  -D MF1750_RUNTIME_LUT_PROFILE_WF23_25=0
  -D MF1750_DUAL_R20_DISCOVERY=1
  -D MF1750_PURE_FIELD_MATRIX=1

[env:pf_white]
extends = env:pf_common
build_src_filter =
  -<*>
  +<epd_driver.cpp>
  +<ec5_dual_r20_h20_white_main.cpp>
build_flags =
  ${env:pf_common.build_flags}
  -D MF1750_ENABLE_FACTORY_OTP_WHITE_RECOVERY=1
  -D MF1750_OTP_WHITE_FOR_PROFILE_WF20_25=0
  -D MF1750_OTP_WHITE_FOR_PROFILE_WF23_25=1
  -D MF1750_OTP_WHITE_FOR_DUAL_R20_H20_20260821=0
  -D MF1750_OTP_WHITE_FOR_DUAL_R20_H23_20260821=0
  -D MF1750_PURE_FIELD_WHITE=1

[env:ec5_pfm_m0_h20]
extends = env:pf_treatment
build_flags = ${env:pf_treatment.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=0 -D MF1750_PURE_FIELD_LAYOUT=0 -D MF1750_DUAL_R20_GLOBAL_WF20_25=1 -D MF1750_DUAL_R20_GLOBAL_WF23_25=0

[env:ec5_pfm_m0_h20_white]
extends = env:pf_white
build_flags = ${env:pf_white.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=0 -D MF1750_PURE_FIELD_LAYOUT=0 -D MF1750_DUAL_R20_GLOBAL_WF20_25=1 -D MF1750_DUAL_R20_GLOBAL_WF23_25=0

[env:ec5_pfm_m0_h23]
extends = env:pf_treatment
build_flags = ${env:pf_treatment.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=1 -D MF1750_PURE_FIELD_LAYOUT=0 -D MF1750_DUAL_R20_GLOBAL_WF20_25=0 -D MF1750_DUAL_R20_GLOBAL_WF23_25=1

[env:ec5_pfm_m0_h23_white]
extends = env:pf_white
build_flags = ${env:pf_white.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=1 -D MF1750_PURE_FIELD_LAYOUT=0 -D MF1750_DUAL_R20_GLOBAL_WF20_25=0 -D MF1750_DUAL_R20_GLOBAL_WF23_25=1

[env:ec5_pfm_h1_h20]
extends = env:pf_treatment
build_flags = ${env:pf_treatment.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=2 -D MF1750_PURE_FIELD_LAYOUT=1 -D MF1750_DUAL_R20_GLOBAL_WF20_25=1 -D MF1750_DUAL_R20_GLOBAL_WF23_25=0

[env:ec5_pfm_h1_h20_white]
extends = env:pf_white
build_flags = ${env:pf_white.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=2 -D MF1750_PURE_FIELD_LAYOUT=1 -D MF1750_DUAL_R20_GLOBAL_WF20_25=1 -D MF1750_DUAL_R20_GLOBAL_WF23_25=0

[env:ec5_pfm_h1_h23]
extends = env:pf_treatment
build_flags = ${env:pf_treatment.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=3 -D MF1750_PURE_FIELD_LAYOUT=1 -D MF1750_DUAL_R20_GLOBAL_WF20_25=0 -D MF1750_DUAL_R20_GLOBAL_WF23_25=1

[env:ec5_pfm_h1_h23_white]
extends = env:pf_white
build_flags = ${env:pf_white.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=3 -D MF1750_PURE_FIELD_LAYOUT=1 -D MF1750_DUAL_R20_GLOBAL_WF20_25=0 -D MF1750_DUAL_R20_GLOBAL_WF23_25=1

[env:ec5_pfm_h2_h20]
extends = env:pf_treatment
build_flags = ${env:pf_treatment.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=4 -D MF1750_PURE_FIELD_LAYOUT=2 -D MF1750_DUAL_R20_GLOBAL_WF20_25=1 -D MF1750_DUAL_R20_GLOBAL_WF23_25=0

[env:ec5_pfm_h2_h20_white]
extends = env:pf_white
build_flags = ${env:pf_white.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=4 -D MF1750_PURE_FIELD_LAYOUT=2 -D MF1750_DUAL_R20_GLOBAL_WF20_25=1 -D MF1750_DUAL_R20_GLOBAL_WF23_25=0

[env:ec5_pfm_h2_h23]
extends = env:pf_treatment
build_flags = ${env:pf_treatment.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=5 -D MF1750_PURE_FIELD_LAYOUT=2 -D MF1750_DUAL_R20_GLOBAL_WF20_25=0 -D MF1750_DUAL_R20_GLOBAL_WF23_25=1

[env:ec5_pfm_h2_h23_white]
extends = env:pf_white
build_flags = ${env:pf_white.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=5 -D MF1750_PURE_FIELD_LAYOUT=2 -D MF1750_DUAL_R20_GLOBAL_WF20_25=0 -D MF1750_DUAL_R20_GLOBAL_WF23_25=1

[env:ec5_pfm_h3_h20]
extends = env:pf_treatment
build_flags = ${env:pf_treatment.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=6 -D MF1750_PURE_FIELD_LAYOUT=3 -D MF1750_DUAL_R20_GLOBAL_WF20_25=1 -D MF1750_DUAL_R20_GLOBAL_WF23_25=0

[env:ec5_pfm_h3_h20_white]
extends = env:pf_white
build_flags = ${env:pf_white.build_flags} -D MF1750_PURE_FIELD_CANDIDATE=6 -D MF1750_PURE_FIELD_LAYOUT=3 -D MF1750_DUAL_R20_GLOBAL_WF20_25=1 -D MF1750_DUAL_R20_GLOBAL_WF23_25=0

[env:ec5_pfm_h3_h23]
