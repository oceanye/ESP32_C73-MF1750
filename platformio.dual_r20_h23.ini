[platformio]
default_envs = ec5_dual_r20_h23
build_dir = .pio/build-dual-r20-h23

[env:ec5_dual_r20_h23]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
build_src_filter =
  -<*>
  +<ec5_dual_r20_h20_epd_driver.cpp>
  +<ec5_dual_r20_h20_main.cpp>
board_build.filesystem = littlefs
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -g0
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_RUNTIME_LUT_EMPIRICAL_H3=1
  -D MF1750_RUNTIME_LUT_PROFILE_WF20_25=1
  -D MF1750_RUNTIME_LUT_PROFILE_WF23_25=0
  -D MF1750_DUAL_R20_DISCOVERY=1
  -D MF1750_DUAL_R20_GLOBAL_WF20_25=0
  -D MF1750_DUAL_R20_GLOBAL_WF23_25=1
