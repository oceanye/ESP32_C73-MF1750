[platformio]
default_envs = ec5_raw_p16_endpoint_gallery_pre_white_anchor_v1b
build_dir = .pio/build-raw-p16-endpoint-gallery-pre-white-anchor-v1b

[env:ec5_raw_p16_endpoint_gallery_pre_white_anchor_v1b]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter =
  -<*>
  +<epd_driver.cpp>
  +<ec5_raw_p16_endpoint_gallery_pre_white_anchor_v1b_main.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -g0
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_FACTORY_OTP_WHITE_RECOVERY=1
  -D MF1750_OTP_WHITE_FOR_PROFILE_WF20_25=0
  -D MF1750_OTP_WHITE_FOR_PROFILE_WF23_25=1
  -D MF1750_OTP_WHITE_FOR_DUAL_R20_H20_20260821=0
  -D MF1750_OTP_WHITE_FOR_DUAL_R20_H23_20260821=0
  -D MF1750_PURE_FIELD_WHITE=1
  -D MF1750_RAW_P16_ENDPOINT_GALLERY_PRE_WHITE_ANCHOR=0
  -D MF1750_RAW_P16_ENDPOINT_GALLERY_PRE_WHITE_ANCHOR_V1B=1
