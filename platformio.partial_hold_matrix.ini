[platformio]
default_envs = ec5_partial_hold_accumulate

[env]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
build_src_filter =
  -<*>
  +<ec5_partial_hold_epd_driver.cpp>
  +<ec5_partial_hold_main.cpp>
board_build.filesystem = littlefs
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_CHROMA_GRID=1
  -D MF1750_PARTIAL_HOLD_BUILD=1

[env:ec5_partial_hold_accumulate]
extends = env
build_flags =
  ${env.build_flags}
  -D MF1750_PARTIAL_HOLD_VARIANT=0

[env:ec5_partial_hold_edges]
extends = env
build_flags =
  ${env.build_flags}
  -D MF1750_PARTIAL_HOLD_VARIANT=1

[env:ec5_partial_hold_cs_split]
extends = env
build_flags =
  ${env.build_flags}
  -D MF1750_PARTIAL_HOLD_VARIANT=2

[env:ec5_partial_hold_acc_vmirror]
extends = env
build_flags =
  ${env.build_flags}
  -D MF1750_PARTIAL_HOLD_VARIANT=3

[env:ec5_partial_hold_acc_symmetric_v2]
extends = env
build_flags =
  ${env.build_flags}
  -D MF1750_PARTIAL_HOLD_VARIANT=4

[env:ec5_partial_hold_acc_symmetric_y_inclusive]
extends = env
build_flags =
  ${env.build_flags}
  -D MF1750_PARTIAL_HOLD_VARIANT=5

[env:ec5_partial_hold_acc_symmetric_blue1]
extends = env
build_flags =
  ${env.build_flags}
  -D MF1750_PARTIAL_HOLD_VARIANT=6

[env:ec5_partial_hold_acc_symmetric_y_inclusive_blue1]
extends = env
build_flags =
  ${env.build_flags}
  -D MF1750_PARTIAL_HOLD_VARIANT=7
