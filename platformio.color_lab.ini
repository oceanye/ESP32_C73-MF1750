[platformio]
default_envs = esp32-s3-devkitc-1-ec5-color-lab

[env:esp32-s3-devkitc-1-ec5-color-lab]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
  +<epd_driver.cpp>
  +<ec5_color_lab_main.cpp>
  -<main.cpp>
  -<n7_main.cpp>
  -<ec5_unknown_probe_main.cpp>
  -<ec5_sixstate_main.cpp>
  -<ec5_u04_u05_compare_main.cpp>
  -<ec5_u07t_main.cpp>
board_build.filesystem = littlefs
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_EIGHTCODE_ATLAS=1
  -D MF1750_ENABLE_COLOR_LAB=1
