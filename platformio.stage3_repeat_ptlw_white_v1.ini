[platformio]
default_envs = ec5_stage3_repeat_ptlw_white_v1
build_dir = .pio/build-stage3-repeat-ptlw-white-v1

[env:ec5_stage3_repeat_ptlw_white_v1]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
build_src_filter =
  -<*>
  +<epd_driver.cpp>
  +<ec5_stage3_wf23_white_recovery_main.cpp>
board_build.filesystem = littlefs
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -g0
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_ENABLE_FACTORY_OTP_WHITE_RECOVERY=1
  -D MF1750_OTP_WHITE_FOR_PROFILE_WF20_25=0
  -D MF1750_OTP_WHITE_FOR_PROFILE_WF23_25=1
  -D MF1750_OTP_WHITE_FOR_STAGE3_WF23_20260821=0
  -D MF1750_OTP_WHITE_FOR_STAGE3_EVENING_20260823=0
  -D MF1750_OTP_WHITE_FOR_POST_V4_20260823=0
  -D MF1750_OTP_WHITE_FOR_POST_V4_PARTIAL_20260823=0
  -D MF1750_OTP_WHITE_FOR_REPEAT_PTLW_20260823=1
