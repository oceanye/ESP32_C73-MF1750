[platformio]
default_envs = ec5_power_qualifier_pon_pof_no_drf_v2
build_dir = .pio/build-power-qualifier-pon-pof-no-drf-v2

[env:ec5_power_qualifier_pon_pof_no_drf_v2]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter =
  -<*>
  +<ec5_power_qualifier_pon_pof_no_drf_v2_driver.cpp>
  +<ec5_power_qualifier_pon_pof_no_drf_v2_main.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -g0
  -D BOARD_HAS_PSRAM
  -D EPD_ENABLE_TEST_PATTERN=0
  -D MF1750_POWER_QUALIFIER_PON_POF_NO_DRF_V2_BUILD=1
  -D MF1750_ENABLE_UNKNOWN_PROBE=0
  -D MF1750_ENABLE_SIXSTATE_PROBE=0
  -D MF1750_ENABLE_U04_U05_COMPARE=0
  -D MF1750_ENABLE_EIGHTCODE_ATLAS=0
  -D MF1750_ENABLE_COLOR_LAB=0
  -D MF1750_ENABLE_OTP_TRANSITION_MATRIX=0
  -D MF1750_ENABLE_DITHER_COLOR_ATLAS=0
  -D MF1750_ENABLE_RUNTIME_LUT_EMPIRICAL_H3=0
  -D MF1750_ENABLE_FACTORY_OTP_WHITE_RECOVERY=0



